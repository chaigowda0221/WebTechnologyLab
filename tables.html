
<html>
<head>
    <title>Vehicle Registration Form</title>
</head>

<body bgcolor="lightyellow">

<center>
    <h1>Vehicle Registration Form</h1>

    <form>
        <table border="1" cellpadding="10" cellspacing="0">

            <tr>
                <th colspan="2">Vehicle Registration Details</th>
            </tr>

            <tr>
                <td>Owner Name</td>
                <td>
                    <input type="text" name="ownername">
                </td>
            </tr>

            <tr>
                <td>Address</td>
                <td>
                    <textarea name="address" rows="3" cols="30"></textarea>
                </td>
            </tr>

            <tr>
                <td>Phone Number</td>
                <td>
                    <input type="text" name="phone">
                </td>
            </tr>

            <tr>
                <td>Email</td>
                <td>
                    <input type="email" name="email">
                </td>
            </tr>

            <tr>
                <td>Vehicle Number</td>
                <td>
                    <input type="text" name="vehiclenumber">
                </td>
            </tr>

            <tr>
                <td>Vehicle Type</td>
                <td>
                    <select name="vehicletype">
                        <option>Car</option>
                        <option>Bike</option>
                        <option>Bus</option>
                        <option>Truck</option>
                        <option>Auto</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Vehicle Model</td>
                <td>
                    <input type="text" name="model">
                </td>
            </tr>

            <tr>
                <td>Vehicle Color</td>
                <td>
                    <input type="text" name="color">
                </td>
            </tr>

            <tr>
                <td>Fuel Type</td>
                <td>
                    <input type="radio" name="fuel"> Petrol
                    <input type="radio" name="fuel"> Diesel
                    <input type="radio" name="fuel"> Electric
                </td>
            </tr>

            <tr>
                <td>Registration Date</td>
                <td>
                    <input type="date" name="date">
                </td>
            </tr>

            <tr>
                <td>Driving License Number</td>
                <td>
                    <input type="text" name="license">
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Register">
                    <input type="reset" value="Clear">
                </td>
            </tr>

        </table>
    </form>

</center>

</body>
</html>
