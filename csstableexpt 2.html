
<html>

<head>
<title>CSS Table</title>

<style>

body {
    background-color: lightyellow;
    text-align: center;
}

table {
    width: 60%;
    border-collapse: collapse;
    margin: 20px auto;
    font-family: Arial, sans-serif;
}

th, td {
    border: 1px solid black;
    padding: 12px;
    text-align: center;
}

th {
    background-color: lightgreen;
}

td {
    background-color: lightblue;
}

</style>
</head>

<body>

<h2>Student Details</h2>

<table>

<tr>
    <th>Roll No</th>
    <th>Name</th>
    <th>Course</th>
</tr>

<tr>
    <td>101</td>
    <td>Akash</td>
    <td>BCA</td>
</tr>

<tr>
    <td>102</td>
    <td>Divya</td>
    <td>BBA</td>
</tr>

<tr>
    <td>103</td>
    <td>Rohan</td>
    <td>BCA</td>
</tr>

</table>

</body>
</html>
