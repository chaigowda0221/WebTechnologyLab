
<html>

<head>
    <title>CSS Image</title>

    <style>
        img {
            width: 300px;
            height: 200px;
            border: 3px solid black;
            border-radius: 10px;
            transition: 0.5s;
        }

        img:hover {
            transform: scale(1.1);
            filter: grayscale(100%);
        }
    </style>

</head>

<body>

    <h2>CSS Image Example</h2>

</body>

</html>
